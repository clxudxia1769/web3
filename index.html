<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f6ff">
  <title>Rock Paper Scissors</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #24233a;
      background: #f5f6ff;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      background:
        radial-gradient(ellipse at 10% 10%, #e8eaff 0, transparent 38%),
        radial-gradient(ellipse at 90% 90%, #e5f7f5 0, transparent 34%),
        #f8f8fc;
    }

    button {
      font: inherit;
    }

    .game {
      width: min(100%, 560px);
      padding: clamp(24px, 6vw, 44px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 24px 70px rgba(48, 48, 90, 0.12);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #7775a0;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #292744;
      font-size: clamp(2rem, 8vw, 3rem);
      letter-spacing: -0.06em;
      line-height: 1.05;
    }

    .subtitle {
      margin: 12px 0 28px;
      color: #77768d;
      font-size: 0.98rem;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      overflow: hidden;
      margin-bottom: 30px;
      border: 1px solid #efeff7;
      border-radius: 18px;
      background: #fafaff;
    }

    .score {
      padding: 17px 8px 15px;
    }

    .score + .score {
      border-left: 1px solid #efeff7;
    }

    .score-number {
      display: block;
      color: #383558;
      font-size: 1.8rem;
      font-weight: 800;
      line-height: 1.1;
    }

    .score-label {
      display: block;
      margin-top: 6px;
      color: #85839b;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .prompt {
      margin: 0 0 16px;
      color: #4b4967;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .choice {
      min-height: 116px;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 8px;
      border: 2px solid #eeeefa;
      border-radius: 18px;
      background: #fff;
      color: #484663;
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    .choice:hover {
      transform: translateY(-4px);
      border-color: #b9b5ff;
      background: #f7f6ff;
      box-shadow: 0 10px 24px rgba(88, 79, 190, 0.12);
    }

    .choice:focus-visible,
    .reset:focus-visible {
      outline: 3px solid #7770e8;
      outline-offset: 3px;
    }

    .choice-emoji {
      font-size: 2.45rem;
      line-height: 1;
    }

    .choice-name {
      font-size: 0.84rem;
      font-weight: 750;
    }

    .result {
      min-height: 116px;
      display: grid;
      align-content: center;
      gap: 8px;
      margin-top: 22px;
      padding: 18px;
      border-radius: 18px;
      background: #f4f3ff;
    }

    .result-title {
      margin: 0;
      color: #4e48b8;
      font-size: 1.2rem;
      font-weight: 800;
    }

    .result-detail {
      margin: 0;
      color: #77758e;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .reset {
      margin-top: 20px;
      padding: 10px 18px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: #77758e;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 750;
      transition: background 160ms ease, color 160ms ease;
    }

    .reset:hover {
      background: #f0effb;
      color: #4e48b8;
    }

    @media (max-width: 420px) {
      .game {
        padding: 25px 18px;
        border-radius: 22px;
      }

      .choices {
        gap: 8px;
      }

      .choice {
        min-height: 104px;
        border-radius: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="game">
    <p class="eyebrow">Quick match</p>
    <h1>Rock Paper Scissors</h1>
    <p class="subtitle">Pick your move and see if you can beat the computer.</p>

    <section class="scoreboard" aria-label="Running score">
      <div class="score">
        <span class="score-number" id="player-score">0</span>
        <span class="score-label">You</span>
      </div>
      <div class="score">
        <span class="score-number" id="tie-score">0</span>
        <span class="score-label">Ties</span>
      </div>
      <div class="score">
        <span class="score-number" id="computer-score">0</span>
        <span class="score-label">Computer</span>
      </div>
    </section>

    <p class="prompt">Choose your move</p>
    <div class="choices" aria-label="Choose rock, paper, or scissors">
      <button class="choice" type="button" data-choice="rock" aria-label="Choose rock">
        <span class="choice-emoji" aria-hidden="true">✊</span>
        <span class="choice-name">Rock</span>
      </button>
      <button class="choice" type="button" data-choice="paper" aria-label="Choose paper">
        <span class="choice-emoji" aria-hidden="true">✋</span>
        <span class="choice-name">Paper</span>
      </button>
      <button class="choice" type="button" data-choice="scissors" aria-label="Choose scissors">
        <span class="choice-emoji" aria-hidden="true">✌️</span>
        <span class="choice-name">Scissors</span>
      </button>
    </div>

    <section class="result" aria-live="polite" aria-atomic="true">
      <p class="result-title" id="result-title">Ready when you are!</p>
      <p class="result-detail" id="result-detail">Your next move starts a new round.</p>
    </section>

    <button class="reset" id="reset-button" type="button">Reset score</button>
  </main>

  <script>
    const choices = ["rock", "paper", "scissors"];
    const emoji = { rock: "✊", paper: "✋", scissors: "✌️" };
    const playerScoreElement = document.querySelector("#player-score");
    const computerScoreElement = document.querySelector("#computer-score");
    const tieScoreElement = document.querySelector("#tie-score");
    const resultTitleElement = document.querySelector("#result-title");
    const resultDetailElement = document.querySelector("#result-detail");
    const score = { player: 0, computer: 0, ties: 0 };

    function playRound(playerChoice) {
      const computerChoice = choices[Math.floor(Math.random() * choices.length)];
      let outcome;

      if (playerChoice === computerChoice) {
        score.ties += 1;
        outcome = "It's a tie!";
      } else if (
        (playerChoice === "rock" && computerChoice === "scissors") ||
        (playerChoice === "paper" && computerChoice === "rock") ||
        (playerChoice === "scissors" && computerChoice === "paper")
      ) {
        score.player += 1;
        outcome = "You win this round!";
      } else {
        score.computer += 1;
        outcome = "Computer wins this round!";
      }

      playerScoreElement.textContent = score.player;
      computerScoreElement.textContent = score.computer;
      tieScoreElement.textContent = score.ties;
      resultTitleElement.textContent = outcome;
      resultDetailElement.textContent =
        `You picked ${emoji[playerChoice]} ${capitalize(playerChoice)}. ` +
        `Computer picked ${emoji[computerChoice]} ${capitalize(computerChoice)}.`;
    }

    function capitalize(word) {
      return word[0].toUpperCase() + word.slice(1);
    }

    function resetScore() {
      score.player = 0;
      score.computer = 0;
      score.ties = 0;
      playerScoreElement.textContent = "0";
      computerScoreElement.textContent = "0";
      tieScoreElement.textContent = "0";
      resultTitleElement.textContent = "Ready when you are!";
      resultDetailElement.textContent = "Your next move starts a new round.";
    }

    document.querySelectorAll(".choice").forEach((button) => {
      button.addEventListener("click", () => playRound(button.dataset.choice));
    });
    document.querySelector("#reset-button").addEventListener("click", resetScore);
  </script>
</body>
</html>
